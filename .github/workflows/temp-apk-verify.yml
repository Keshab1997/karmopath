name: TEMP — verify APK with this branch's feed

# Branch-only verification helper. This file never goes to main. It uses the
# same reusable builder as Build Android APK or AAB (Manual), pointed at this
# branch's feed because the Arena GitHub integration cannot dispatch a
# workflow_dispatch run. Removed once the APK artifact is produced.
on:
  push:
    branches: [arena/c19cf3cb-karmopath]

permissions:
  contents: read

jobs:
  build:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.15.0
    with:
      flutter-channel: stable
      build-apk: true
      build-aab: false
      dart-defines: >-
        KARMOPATH_FEED_URL=https://raw.githubusercontent.com/Keshab1997/karmopath/arena/c19cf3cb-karmopath/feed/jobs.json
      artifact-retention-days: 14
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
