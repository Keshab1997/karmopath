name: Build Android APK or AAB (Manual)

on:
  workflow_dispatch:
    inputs:
      format:
        description: Which Android file should be built?
        required: true
        type: choice
        options:
          - apk
          - aab
        default: apk
      test_feed_url:
        description: >-
          Public HTTPS non-production fixture URL for an APK test build only.
          The URL is embedded in the binary; never include credentials or tokens.
          Leave blank to build the foundation screen. AAB builds ignore this.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.15.2
    with:
      flutter-channel: stable
      build-apk: ${{ inputs.format == 'apk' }}
      build-aab: ${{ inputs.format == 'aab' }}
      dart-defines: >-
        ${{ inputs.format == 'apk' && inputs.test_feed_url != '' && format('KARMOPATH_FEED_URL={0}', inputs.test_feed_url) || '' }}
      artifact-retention-days: 14
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
