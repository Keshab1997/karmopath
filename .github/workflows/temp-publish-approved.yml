name: TEMP — publish the approved notice

# Branch-only fallback. The labels are on issue #5, but GitHub does not start a
# new workflow from an event caused by the built-in Actions token. This runs the
# same publisher as publish-notice.yml and refuses unless both the notice-review
# and approve-notice labels are present. Removed after one run.
on:
  push:
    branches: [arena/697a8d1c-karmopath]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require the owner's labels on issue 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh issue view 5 --repo "$GITHUB_REPOSITORY" --json labels \
            --jq '[.labels[].name] | join(",")')
          echo "labels: $labels"
          grep -q 'notice-review' <<< "$labels"
          grep -q 'approve-notice' <<< "$labels"

      - name: Run the merged publisher against the approved issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view 5 --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,url > issue.json
          python3 scripts/publish_notice.py \
            --issue issue.json \
            --sources ops/notice_sources.json \
            --feed feed/jobs.json
          python3 tools/feed/validate.py feed/jobs.json
          (cd tools/feed && python3 check_publish.py ../../feed/jobs.json)

      - name: Commit the feed to main
        id: commit
        run: |
          git config user.name "karmopath-notice-bot"
          git config user.email "karmopath-notice-bot@users.noreply.github.com"
          git add feed/jobs.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git pull --rebase --autostash origin main
          git commit -m "feat(feed): publish approved notice #5"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment on and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            body="Published to the app feed in ${SHA}. Feed: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/feed/jobs.json"
          else
            body="Already in the app feed; nothing changed."
          fi
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close 5 --repo "$GITHUB_REPOSITORY" --reason completed
