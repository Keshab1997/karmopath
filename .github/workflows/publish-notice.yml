name: Publish an approved official notice

# The discovery workflow only opens review issues. A human opens the notice,
# checks it on the official site, and adds the `approve-notice` label. Only
# that action writes to feed/jobs.json. The label can only be applied by
# someone with write access, and the publisher re-checks the link against the
# approved domains in ops/notice_sources.json.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-notice
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.label.name == 'approve-notice' &&
      contains(github.event.issue.labels.*.name, 'notice-review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline tests for the publisher and validator
        run: |
          python3 -m unittest discover -s tests/ops -p "test_*.py" -v
          python3 -m unittest discover -s tests/feed -p "test_validate.py" -v

      - name: Build one notice-only card from the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json number,title,body,url > issue.json
          python3 scripts/publish_notice.py \
            --issue issue.json \
            --sources ops/notice_sources.json \
            --feed feed/jobs.json
          python3 tools/feed/validate.py feed/jobs.json
          (cd tools/feed && python3 check_publish.py ../../feed/jobs.json)

      - name: Commit the feed
        id: commit
        run: |
          git config user.name "karmopath-notice-bot"
          git config user.email "karmopath-notice-bot@users.noreply.github.com"
          git add feed/jobs.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Another workflow (daily discovery) also writes to main.
          git pull --rebase --autostash origin main
          git commit -m "feat(feed): publish approved notice #${{ github.event.issue.number }}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment on and close the review issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            body="Published to the app feed in ${SHA}. Feed: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/feed/jobs.json"
          else
            body="This notice was already in the app feed; nothing changed."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$body"
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Report a failed publish
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "Publishing failed; see the Actions run. The feed was not changed."
