name: TEMP — apply the owner-requested notice labels

# Branch-only helper. This integration can create issues but cannot add labels
# to them, so this workflow uses the Actions token to apply the labels the
# owner asked for. The publisher on main is still the only thing that writes
# the feed, and it still requires the approve-notice label.
on:
  push:
    branches: [arena/697a8d1c-karmopath]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add notice-review, then approve-notice
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: "5"
        run: |
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label notice-review
          sleep 3
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label approve-notice
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq '.labels[].name'
