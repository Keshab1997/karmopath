name: karmopath
description: Bengali-first independent job discovery and deadline tracking.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_local_notifications: 22.3.2
  timezone: 0.11.2
  url_launcher: 6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
